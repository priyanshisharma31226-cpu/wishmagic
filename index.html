
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#25134d">
<title>WishMagic - Daily Wishes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f3ff;color:#28213b}
header{background:linear-gradient(135deg,#25134d,#7545c8);color:white;padding:25px 18px;text-align:center;border-radius:0 0 25px 25px}
.logo{font-size:40px}
header h1{margin:5px;font-size:30px}
header p{margin:8px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px}
button{cursor:pointer;border:0}
.lang{background:white;color:#55319b;padding:10px 15px;border-radius:20px;font-weight:bold}
h2{font-size:20px;margin:15px}
.categories{display:flex;gap:9px;overflow-x:auto;padding:5px 14px 15px}
.cat{white-space:nowrap;background:white;color:#56358f;border:1px solid #e2d5fa;padding:11px 15px;border-radius:22px}
.cat.active{background:#6239aa;color:white}
#search{display:block;width:calc(100% - 28px);margin:5px 14px 15px;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:0 14px 25px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #25134d12}
.art{min-height:155px;padding:18px 12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;background:linear-gradient(135deg,#f6a6bb,#8d61cf)}
.art .emoji{font-size:35px}
.art p{font-size:15px;font-weight:bold;line-height:1.5}
.card small{display:block;text-align:center;padding:10px 3px 2px;color:#7659a7}
.share{display:block;background:#6239aa;color:white;border-radius:9px;padding:10px;margin:9px auto 12px;width:85%;font-weight:bold}
footer{text-align:center;padding:20px;color:#776a8d;font-size:13px}
.empty{grid-column:1/-1;text-align:center;padding:30px}
</style>
</head>
<body>
<header>
<div class="logo">✨</div>
<h1>WishMagic</h1>
<p id="tagline">Spread Happiness Every Day</p>
</header>

<div class="top">
<strong id="today">Daily Wishes</strong>
<button class="lang" onclick="toggleLang()" id="language">हिंदी</button>
</div>

<h2 id="heading">Choose Your Wishes 💜</h2>
<input id="search" placeholder="Search wishes..." oninput="render()">

<div class="categories" id="categories"></div>
<div class="grid" id="cards"></div>

<footer>✨ WishMagic – Share Love, Spread Happiness ✨</footer>

<script>
let hindi=false;
let selected="All";

const wishes=[
{cat:"Morning",emoji:"🌞",en:"Good Morning! May your day be filled with happiness and success.",hi:"सुप्रभात! आपका दिन खुशियों और सफलता से भरा रहे।"},
{cat:"Morning",emoji:"🌻",en:"Wake up with a smile and make today beautiful!",hi:"मुस्कान के साथ उठिए और आज के दिन को खूबसूरत बनाइए!"},
{cat:"Night",emoji:"🌙",en:"Good Night! May your dreams be sweet and peaceful.",hi:"शुभ रात्रि! आपके सपने सुंदर और सुकून भरे हों।"},
{cat:"Night",emoji:"⭐",en:"Forget your worries and sleep peacefully. Sweet dreams!",hi:"अपनी चिंताएँ भूलकर चैन से सोइए। मीठे सपने!"},
{cat:"Birthday",emoji:"🎂",en:"Happy Birthday! May all your dreams come true.",hi:"जन्मदिन की हार्दिक शुभकामनाएँ! आपके सभी सपने पूरे हों।"},
{cat:"Birthday",emoji:"🎉",en:"Wishing you a year full of love, laughter and success!",hi:"आपका नया साल प्यार, हँसी और सफलता से भरा हो!"},
{cat:"Love",emoji:"❤️",en:"Love makes every moment beautiful. Keep smiling!",hi:"प्यार हर पल को खूबसूरत बनाता है। हमेशा मुस्कुराते रहिए!"},
{cat:"Love",emoji:"🌹",en:"True friendship is a beautiful gift of life.",hi:"सच्ची दोस्ती जीवन का एक खूबसूरत उपहार है।"},
{cat:"Motivation",emoji:"🌈",en:"Believe in yourself. Every small step matters.",hi:"खुद पर विश्वास रखिए। हर छोटा कदम मायने रखता है।"},
{cat:"Motivation",emoji:"💪",en:"Never give up. Your hard work will shine one day.",hi:"कभी हार मत मानिए। आपकी मेहनत एक दिन जरूर रंग लाएगी।"},
{cat:"Festival",emoji:"🪔",en:"May your life shine with happiness and prosperity!",hi:"आपका जीवन खुशियों और समृद्धि से जगमगाता रहे!"},
{cat:"Festival",emoji:"🎊",en:"Wishing you peace, joy and wonderful celebrations!",hi:"आपको शांति, आनंद और खुशियों भरे त्योहार की शुभकामनाएँ!"}
];

const labels={
All:["All","सभी"],Morning:["Morning","सुप्रभात"],Night:["Night","शुभ रात्रि"],
Birthday:["Birthday","जन्मदिन"],Love:["Love","प्यार"],Motivation:["Motivation","प्रेरणा"],Festival:["Festival","त्योहार"]
};

function toggleLang(){
hindi=!hindi;
document.getElementById("language").textContent=hindi?"English":"हिंदी";
document.getElementById("tagline").textContent=hindi?"हर दिन खुशियाँ बाँटें":"Spread Happiness Every Day";
document.getElementById("heading").textContent=hindi?"अपनी पसंद की शुभकामनाएँ चुनें 💜":"Choose Your Wishes 💜";
document.getElementById("search").placeholder=hindi?"शुभकामनाएँ खोजें...":"Search wishes...";
render();
}

function render(){
let cats=Object.keys(labels);
document.getElementById("categories").innerHTML=cats.map(c=>
`<button class="cat ${selected===c?'active':''}" onclick="choose('${c}')">${labels[c][hindi?1:0]}</button>`
).join("");

let q=document.getElementById("search").value.toLowerCase();
let filtered=wishes.filter(w=>(selected==="All"||w.cat===selected)&&
(w.en.toLowerCase().includes(q)||w.hi.includes(q)||labels[w.cat][0].toLowerCase().includes(q)||labels[w.cat][1].includes(q)));

document.getElementById("cards").innerHTML=filtered.length?filtered.map((w,i)=>`
<div class="card">
<div class="art">
<div class="emoji">${w.emoji}</div>
<p>${hindi?w.hi:w.en}</p>
</div>
<small>${labels[w.cat][hindi?1:0]}</small>
<button class="share" onclick="shareWish(${wishes.indexOf(w)})">${hindi?"शेयर करें ↗":"Share ↗"}</button>
</div>`).join(""):`<div class="empty">${hindi?"कोई शुभकामना नहीं मिली":"No wishes found"}</div>`;
}

function choose(c){selected=c;render()}

async function shareWish(i){
let w=wishes[i];
let message="✨ WishMagic ✨\n\n"+(hindi?w.hi:w.en)+"\n\nSpread Happiness Every Day!";
if(navigator.share){
try{await navigator.share({title:"WishMagic",text:message})}catch(e){}
}else{
try{await navigator.clipboard.writeText(message);alert(hindi?"शुभकामना कॉपी हो गई!":"Wish copied!")}catch(e){prompt("Copy your wish:",message)}
}
}
render();
</script>
</body>
</html>
