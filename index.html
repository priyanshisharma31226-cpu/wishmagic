
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b35c9">
<meta name="description" content="WishMagic - Spread Happiness Every Day">

<title>WishMagic</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff3fa;color:#382044;font-family:Arial;text-align:center}
header{background:linear-gradient(120deg,#8b35c9,#ec4899);color:white;padding:25px}
h1{margin:5px;font-size:32px}
button{border:0;border-radius:22px;padding:12px 15px;margin:5px;background:#913bc9;color:white;font-weight:bold}
button:active{opacity:.7}
nav{padding:12px;display:flex;justify-content:center;flex-wrap:wrap}
.card{background:white;border-radius:20px;padding:15px;margin:12px auto;max-width:430px;box-shadow:0 3px 12px #ddd}
.card img{width:100%;height:230px;object-fit:cover;border-radius:15px}
.quote{font-size:21px;font-weight:bold;line-height:1.5}
select{padding:10px;border-radius:15px}
#installBtn{background:#e83e8c;font-size:16px}
footer{padding:20px}
</style>
</head>

<body>

<header>
<h1>✨ WishMagic ✨</h1>
<p>Spread Happiness Every Day!</p>
</header>

<button id="installBtn" hidden>📲 Install WishMagic App</button>

<p>
<select id="language" onchange="changeLanguage()">
<option value="en">English</option>
<option value="hi">हिंदी</option>
</select>
</p>

<nav>
<button onclick="show('morning')">🌅 Morning</button>
<button onclick="show('night')">🌙 Night</button>
<button onclick="show('love')">❤️ Love</button>
<button onclick="show('birthday')">🎂 Birthday</button>
<button onclick="show('motivation')">💪 Motivation</button>
<button onclick="show('festival')">🎉 Festival</button>
</nav>

<div class="card">
<h2 id="heading">🌅 Good Morning</h2>

<img id="photo" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900" alt="Wish picture">

<p class="quote" id="quote">
Every morning is a new beginning. Smile and shine!
</p>

<button onclick="nextWish()" id="next">🔄 New Wish</button>
<button onclick="share()">📲 WhatsApp</button>
<button onclick="downloadImage()">⬇️ Download Image</button>
</div>

<footer>Made with ❤️ by WishMagic</footer>

<script>
const data={
morning:[
["Every morning is a new beginning. Smile and shine!","हर सुबह एक नई शुरुआत है। मुस्कुराइए और चमकिए!","https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900"],
["Rise up and make today beautiful!","उठिए और आज के दिन को खूबसूरत बनाइए!","https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900"]
],
night:[
["Close your eyes and welcome sweet dreams. Good Night!","आँखें बंद करें और मीठे सपनों का स्वागत करें। शुभ रात्रि!","https://images.unsplash.com/photo-1519681393784-d120267933ba?w=900"],
["May your night be peaceful and beautiful.","आपकी रात शांत और सुंदर हो। शुभ रात्रि!","https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900"]
],
love:[
["Love makes every moment beautiful. ❤️","प्यार हर पल को खूबसूरत बना देता है। ❤️","https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=900"]
],
birthday:[
["Wishing you a birthday full of happiness! 🎂","आपका जन्मदिन खुशियों से भरा हो! 🎂","https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=900"]
],
motivation:[
["Believe in yourself. You can achieve anything!","खुद पर विश्वास रखिए। आप सब कुछ हासिल कर सकते हैं!","https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900"]
],
festival:[
["May happiness and prosperity fill your home!","आपका घर खुशियों और समृद्धि से भरा रहे!","https://images.unsplash.com/photo-1512389142860-9c449e58a543?w=900"]
]
};

const titles={
morning:["🌅 Good Morning","🌅 सुप्रभात"],
night:["🌙 Good Night","🌙 शुभ रात्रि"],
love:["❤️ Love Wishes","❤️ प्यार भरे संदेश"],
birthday:["🎂 Birthday Wishes","🎂 जन्मदिन की शुभकामनाएँ"],
motivation:["💪 Motivation","💪 प्रेरणा"],
festival:["🎉 Festival Wishes","🎉 त्योहार की शुभकामनाएँ"]
};

let current="morning",index=0,lang="en";

function update(){
let item=data[current][index];
document.getElementById("heading").innerText=titles[current][lang==="en"?0:1];
document.getElementById("quote").innerText=item[lang==="en"?0:1];
document.getElementById("photo").src=item[2];
}

function show(type){current=type;index=0;update()}
function nextWish(){index=(index+1)%data[current].length;update()}
function changeLanguage(){
lang=document.getElementById("language").value;
update();
}

function share(){
let msg=document.getElementById("heading").innerText+"\n"+
document.getElementById("quote").innerText+"\n\n✨ WishMagic";
window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}

async function downloadImage(){
let url=data[current][index][2];
try{
let response=await fetch(url);
let blob=await response.blob();
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="WishMagic.jpg";
link.click();
URL.revokeObjectURL(link.href);
}catch(e){
alert("Image download failed. Please try again.");
}
}

// PWA SERVICE WORKER
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./service-worker.js")
.then(()=>console.log("WishMagic Service Worker Ready"))
.catch(error=>console.log("Service Worker Error:",error));
});
}

// INSTALL APP
let deferredPrompt;
const installBtn=document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt",(event)=>{
event.preventDefault();
deferredPrompt=event;
installBtn.hidden=false;
});

installBtn.addEventListener("click",async()=>{
if(!deferredPrompt){
alert("Please use Chrome and open the website to install WishMagic.");
return;
}
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt=null;
installBtn.hidden=true;
});

window.addEventListener("appinstalled",()=>{
installBtn.hidden=true;
alert("WishMagic installed successfully!");
});

update();
</script>

</body>
  </html>
